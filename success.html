<!DOCTYPE html>
<html lang="en" data-visual="material" data-mode="light" data-theme="auto" data-m3="expressive">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta name="stt-build" content="1.2.17" />
  <title>Confirming payment — Screen Time Tracker</title>
  <meta name="description" content="Confirming your Screen Time Tracker Pro payment." />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
  <script>
    (function () {
      try {
        var v = localStorage.getItem("stt_site_visual") || "material";
        if (v !== "editorial" && v !== "minimal") v = "material";
        var m = localStorage.getItem("stt_site_mode") || "system";
        var tone = m === "dark" || m === "light" ? m :
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-visual", v);
        document.documentElement.setAttribute("data-mode", tone);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/theme-tokens.css" />
  <link rel="stylesheet" href="/success.css" />
</head>
<body class="sx-page" data-sx-state="verifying">
  <div class="sx-ambient" aria-hidden="true">
    <span class="sx-blob sx-blob-a"></span>
    <span class="sx-blob sx-blob-b"></span>
    <span class="sx-blob sx-blob-c"></span>
    <span class="sx-mesh"></span>
  </div>

  <header class="sx-top">
    <a class="sx-brand" href="/">
      <img src="/brand-mark.png" width="28" height="28" alt="" />
      <span>Screen Time Tracker</span>
    </a>
  </header>

  <main class="sx-shell">
    <div class="sx-frame">
      <svg class="sx-frame-wave" viewBox="0 0 440 640" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--m3-primary)" />
            <stop offset="45%" stop-color="var(--m3-secondary)" />
            <stop offset="100%" stop-color="var(--m3-tertiary)" />
          </linearGradient>
        </defs>
        <path class="sx-frame-path" fill="none" stroke="url(#frameGrad)"
          d="M40,28
             C90,18 150,22 200,16 C260,10 310,24 360,20 C400,16 418,40 422,80
             C428,140 416,200 424,260 C430,320 412,380 420,440 C426,500 408,560 380,590
             C340,620 280,612 220,618 C160,624 100,608 60,590 C28,572 16,520 14,460
             C10,400 22,340 12,280 C4,220 18,160 14,100 C12,60 22,34 40,28 Z" />
      </svg>

      <section class="sx-card" aria-labelledby="sx-title" aria-live="polite">
        <div class="sx-tonal-top" aria-hidden="true"></div>

        <div class="sx-hero">
          <div class="sx-orbit" aria-hidden="true">
            <svg class="sx-wavy" viewBox="0 0 200 200" width="200" height="200">
              <defs>
                <linearGradient id="sxGradA" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="var(--m3-primary)" />
                  <stop offset="100%" stop-color="var(--m3-secondary)" />
                </linearGradient>
                <linearGradient id="sxGradB" x1="100%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="var(--m3-tertiary)" />
                  <stop offset="100%" stop-color="var(--m3-primary)" />
                </linearGradient>
              </defs>
              <circle class="sx-track" cx="100" cy="100" r="86" fill="none" />
              <circle class="sx-track sx-track-inner" cx="100" cy="100" r="72" fill="none" />
              <path class="sx-ring sx-ring-a" fill="none" stroke="url(#sxGradA)"
                d="M100,14 C148,14 186,52 186,100 C186,148 148,186 100,186 C52,186 14,148 14,100 C14,52 52,14 100,14
                   C122,14 142,28 152,48 C164,72 160,100 144,118 C126,140 96,146 74,136 C52,126 40,100 48,76 C56,52 76,36 100,36" />
              <path class="sx-ring sx-ring-b" fill="none" stroke="url(#sxGradB)"
                d="M100,28 C140,28 172,60 172,100 C172,140 140,172 100,172 C60,172 28,140 28,100 C28,60 60,28 100,28
                   C116,28 132,38 140,54 C150,74 146,98 132,114 C116,132 90,136 72,124 C54,112 48,88 56,70 C64,52 80,40 100,40" />
              <circle class="sx-dot" cx="100" cy="14" r="4.5" fill="var(--m3-primary)" />
              <circle class="sx-dot sx-dot-b" cx="100" cy="28" r="3" fill="var(--m3-secondary)" />
            </svg>
            <div class="sx-logo">
              <img src="/brand-mark.png" width="72" height="72" alt="" />
              <span class="sx-check" id="sx-check" title="Status" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                  <path id="sx-check-path" d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>
          </div>
        </div>

        <p class="sx-chip" id="sx-chip">
          <span class="sx-chip-pulse" aria-hidden="true"></span>
          <span id="sx-chip-text">Verifying payment…</span>
        </p>

        <h1 id="sx-title">Confirming your payment</h1>
        <p class="sx-sub" id="sx-sub">Checking with PayPal / Razorpay. Stay on this page — we’ll open your dashboard when Pro is unlocked.</p>

        <div class="sx-facts" aria-label="Plan details">
          <div class="sx-fact">
            <span class="sx-fact-ico" aria-hidden="true">✦</span>
            <div>
              <span class="sx-fact-label">Plan</span>
              <span class="sx-fact-value" id="fact-plan">Yearly</span>
            </div>
          </div>
          <div class="sx-fact">
            <span class="sx-fact-ico" aria-hidden="true">✉</span>
            <div>
              <span class="sx-fact-label">Email</span>
              <span class="sx-fact-value" id="fact-email">—</span>
            </div>
          </div>
          <div class="sx-fact">
            <span class="sx-fact-ico" aria-hidden="true">◎</span>
            <div>
              <span class="sx-fact-label">Paid with</span>
              <span class="sx-fact-value" id="fact-provider">—</span>
            </div>
          </div>
        </div>

        <p class="sx-hint" id="hint">This usually takes a few seconds.</p>

        <div class="sx-actions">
          <button type="button" class="sx-dash" id="dashBtn" disabled>
            <svg class="sx-dash-wave" viewBox="0 0 320 64" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="var(--m3-primary)" />
                  <stop offset="50%" stop-color="var(--m3-secondary)" />
                  <stop offset="100%" stop-color="var(--m3-tertiary)" />
                </linearGradient>
              </defs>
              <path class="sx-dash-path" fill="none" stroke="url(#btnGrad)"
                d="M18,32
                   C40,12 70,52 100,32 C130,12 160,52 190,32 C220,12 250,52 280,32 C295,22 305,28 312,32
                   C305,38 295,42 280,32 C250,12 220,52 190,32 C160,12 130,52 100,32 C70,12 40,52 18,32
                   C12,36 10,40 8,32 C10,24 12,28 18,32 Z" />
              <rect class="sx-dash-rect" x="3" y="3" width="314" height="58" rx="29" ry="29" fill="none" stroke="url(#btnGrad)" />
            </svg>
            <span class="sx-dash-inner">
              <svg class="sx-dash-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
                <path d="M4 13h7V4H4v9zm0 7h7v-5H4v5zm9 0h7V11h-7v9zm0-16v5h7V4h-7z" fill="currentColor"/>
              </svg>
              <span id="dashBtnLabel">Waiting for confirmation…</span>
            </span>
          </button>

          <a class="sx-tonal-btn" id="homeBtn" href="/checkout.html">Back to checkout</a>
        </div>
      </section>
    </div>
  </main>

  <script src="/site-theme.js" defer></script>
  <script>
    // Build 1.2.17 — stay here while verifying provider payment; dashboard only after is_pro
    const p = new URLSearchParams(location.search);
    const stored = (() => {
      try { return JSON.parse(sessionStorage.getItem("stt_success_ctx") || "{}"); } catch { return {}; }
    })();

    let email = (p.get("email") || stored.email || "").trim().toLowerCase();
    let cycle = p.get("cycle") || stored.cycle || "yearly";
    let provider = (p.get("provider") || stored.provider || "").toLowerCase();
    let userId = p.get("user_id") || stored.user_id || "";
    let paymentId = p.get("payment_id") || stored.payment_id || "";
    let orderId = p.get("order_id") || p.get("token") || stored.order_id || "";
    let signature = p.get("signature") || stored.signature || "";
    let accessToken = stored.access_token || "";

    function normalizeExtId(raw) {
      const id = String(raw || "").toLowerCase().replace(/[^a-p]/g, "");
      if (id.length !== 32) return "";
      if (id === "invalid" || id.includes("invalid")) return "";
      return id;
    }

    let extId = normalizeExtId(p.get("ext_id") || stored.ext_id);
    try {
      if (extId) localStorage.setItem("stt_ext_id", extId);
      else {
        const s = normalizeExtId(localStorage.getItem("stt_ext_id"));
        if (s) extId = s;
        else localStorage.removeItem("stt_ext_id");
      }
    } catch {}

    const planNice = String(cycle).replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
    const payNice = provider
      ? String(provider).replace(/\b\w/g, (c) => c.toUpperCase())
      : "Checkout";

    document.getElementById("fact-plan").textContent = planNice;
    document.getElementById("fact-email").textContent = email || "Your billing email";
    document.getElementById("fact-provider").textContent = payNice;

    const chip = document.getElementById("sx-chip");
    const chipText = document.getElementById("sx-chip-text");
    const title = document.getElementById("sx-title");
    const sub = document.getElementById("sx-sub");
    const hint = document.getElementById("hint");
    const dashBtn = document.getElementById("dashBtn");
    const dashBtnLabel = document.getElementById("dashBtnLabel");
    const homeBtn = document.getElementById("homeBtn");

    function setState(state, copy) {
      document.body.dataset.sxState = state;
      if (copy.chip) chipText.textContent = copy.chip;
      if (copy.title) title.textContent = copy.title;
      if (copy.sub) sub.textContent = copy.sub;
      if (copy.hint) hint.textContent = copy.hint;
      if (copy.btn) dashBtnLabel.textContent = copy.btn;
      document.title =
        state === "confirmed"
          ? "You're Pro — Screen Time Tracker"
          : state === "failed"
            ? "Payment not confirmed — Screen Time Tracker"
            : "Confirming payment — Screen Time Tracker";
    }

    function authHeaders() {
      const h = { "Content-Type": "application/json", Accept: "application/json" };
      if (accessToken) h.Authorization = "Bearer " + accessToken;
      return h;
    }

    function pingExtension(payload) {
      return new Promise((resolve) => {
        if (!extId || typeof chrome === "undefined" || !chrome.runtime?.sendMessage) {
          resolve({ ok: false, error: "no_runtime" });
          return;
        }
        try {
          chrome.runtime.sendMessage(extId, payload, function (res) {
            const err = chrome.runtime.lastError;
            if (err) {
              resolve({ ok: false, error: err.message || "lastError" });
              return;
            }
            resolve(res || { ok: false });
          });
        } catch (e) {
          resolve({ ok: false, error: e.message || "send_failed" });
        }
      });
    }

    async function openDashboard() {
      dashBtn.disabled = false;
      const res = await pingExtension({
        type: "STT_OPEN_DASHBOARD",
        hash: "pro",
        refresh: true,
        open: true,
        replaceTab: true,
        email,
        cycle,
        provider,
        user_id: userId,
        is_pro: true,
      });
      if (res?.ok) {
        hint.textContent = "Opening your dashboard…";
        // Mark URL so extension tab listener can also hand off if messaging was slow
        try {
          const u = new URL(location.href);
          u.searchParams.set("verified", "1");
          u.searchParams.set("handoff", "1");
          u.searchParams.delete("pending");
          history.replaceState(null, "", u.toString());
        } catch {}
        return true;
      }
      hint.textContent =
        "Pro is unlocked. Open Screen Time Tracker from Chrome’s toolbar → Dashboard.";
      dashBtnLabel.textContent = "Open dashboard";
      return false;
    }

    async function checkAccess() {
      if (!email) return null;
      const url = "/api/stt/access?product=stt&email=" + encodeURIComponent(email);
      const res = await fetch(url, { headers: authHeaders() });
      const data = await res.json().catch(() => ({}));
      if (data && data.is_pro === true) return data;
      return null;
    }

    async function verifyRazorpay() {
      if (!paymentId) return null;
      if (signature && orderId) {
        const res = await fetch("/api/razorpay/verify-payment", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({
            razorpay_payment_id: paymentId,
            razorpay_order_id: orderId,
            razorpay_signature: signature,
            email,
            cycle,
            user_id: userId || undefined,
            access_token: accessToken || undefined,
            ext_id: extId || undefined,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success && data.is_pro === true) return data;
      }
      const claim = await fetch("/api/razorpay/claim-payment", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({
          payment_id: paymentId,
          order_id: orderId || undefined,
          email,
          cycle,
          user_id: userId || undefined,
          access_token: accessToken || undefined,
          ext_id: extId || undefined,
        }),
      });
      const c = await claim.json().catch(() => ({}));
      if (claim.ok && c.success && c.is_pro === true) return c;
      return null;
    }

    async function verifyPaypal() {
      if (!orderId) return null;
      const res = await fetch("/api/paypal/capture-order", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({
          order_id: orderId,
          email,
          cycle,
          user_id: userId || undefined,
          access_token: accessToken || undefined,
          ext_id: extId || undefined,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.success && data.is_pro === true) return data;
      return null;
    }

    async function runVerification() {
      setState("verifying", {
        chip: "Verifying payment…",
        title: "Confirming your payment",
        sub:
          "Checking with " +
          (payNice || "your payment provider") +
          ". Stay on this page — dashboard opens only after Pro is unlocked.",
        hint: "This usually takes a few seconds.",
        btn: "Waiting for confirmation…",
      });
      dashBtn.disabled = true;

      let confirmed = null;
      const maxAttempts = 8;

      for (let i = 0; i < maxAttempts; i++) {
        hint.textContent =
          i === 0
            ? "Contacting " + (payNice || "provider") + "…"
            : "Still confirming… (" + (i + 1) + "/" + maxAttempts + ")";

        try {
          if (provider === "razorpay" || paymentId) {
            confirmed = await verifyRazorpay();
          } else if (provider === "paypal" || orderId) {
            confirmed = await verifyPaypal();
          }
          if (!confirmed) confirmed = await checkAccess();
        } catch (e) {
          hint.textContent = (e && e.message) || "Network blip — retrying…";
        }

        if (confirmed && confirmed.is_pro === true) break;
        await new Promise((r) => setTimeout(r, 1500 + i * 400));
      }

      if (confirmed && confirmed.is_pro === true) {
        if (confirmed.email) email = confirmed.email;
        if (confirmed.cycle || confirmed.plan) cycle = confirmed.cycle || confirmed.plan;
        if (confirmed.provider) provider = confirmed.provider;
        if (confirmed.user_id) userId = confirmed.user_id;
        document.getElementById("fact-plan").textContent = String(cycle)
          .replace(/_/g, " ")
          .replace(/\b\w/g, (c) => c.toUpperCase());
        document.getElementById("fact-provider").textContent = String(provider || payNice)
          .replace(/\b\w/g, (c) => c.toUpperCase());

        setState("confirmed", {
          chip: "Payment confirmed",
          title: "Welcome to Pro",
          sub: "Pro is unlocked on this email. Opening your dashboard…",
          hint: "Almost done — handoff to the extension.",
          btn: "Opening dashboard…",
        });
        try {
          sessionStorage.removeItem("stt_pp_order");
          sessionStorage.removeItem("stt_rzp_order");
        } catch {}
        await openDashboard();
        return;
      }

      setState("failed", {
        chip: "Not confirmed yet",
        title: "We couldn’t confirm Pro yet",
        sub:
          "Payment may still be processing, or verify failed. You remain on Free until Pro unlocks. Stay here and retry, or return to checkout with your payment id.",
        hint: paymentId
          ? "Payment id: " + paymentId
          : orderId
            ? "Order: " + orderId
            : "No payment reference found — complete checkout again.",
        btn: "Retry verification",
      });
      dashBtn.disabled = false;
      homeBtn.href = "/checkout.html" + (email ? "?email=" + encodeURIComponent(email) : "");
    }

    dashBtn.addEventListener("click", function () {
      if (document.body.dataset.sxState === "failed") {
        runVerification();
        return;
      }
      if (document.body.dataset.sxState === "confirmed") {
        openDashboard();
      }
    });

    // Already marked verified in URL (refresh) → open dashboard
    if (p.get("verified") === "1" || p.get("handoff") === "1") {
      setState("confirmed", {
        chip: "Payment confirmed",
        title: "Welcome to Pro",
        sub: "Pro is ready. Opening your dashboard…",
        hint: "",
        btn: "Open dashboard",
      });
      openDashboard();
    } else {
      runVerification();
    }
  </script>
</body>
</html>
