<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta name="stt-build" content="1.2.20" />
  <title>Confirming payment — Screen Time Tracker</title>
  <meta name="description" content="Confirming your Screen Time Tracker Pro payment." />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/success.css" />
</head>
<body class="sx-page" data-sx-state="verifying">
  <div class="sx-ambient" aria-hidden="true">
    <span class="sx-blob sx-blob-a"></span>
    <span class="sx-blob sx-blob-b"></span>
    <span class="sx-blob sx-blob-c"></span>
  </div>

  <main class="sx-shell">
    <div class="sx-frame">
      <svg class="sx-wave" viewBox="0 0 400 560" preserveAspectRatio="none" aria-hidden="true">
        <path class="sx-wave-path"
          d="M28,36
             C72,18 128,28 176,22 C228,16 276,30 324,24 C356,20 378,44 382,78
             C388,130 376,188 384,244 C390,300 372,356 380,412 C386,460 368,508 336,528
             C292,552 236,544 184,550 C132,556 78,540 48,520 C24,504 16,452 14,400
             C10,340 22,284 12,228 C4,172 18,120 14,78 C12,52 18,40 28,36 Z" />
        <path class="sx-wave-glow"
          d="M28,36
             C72,18 128,28 176,22 C228,16 276,30 324,24 C356,20 378,44 382,78
             C388,130 376,188 384,244 C390,300 372,356 380,412 C386,460 368,508 336,528
             C292,552 236,544 184,550 C132,556 78,540 48,520 C24,504 16,452 14,400
             C10,340 22,284 12,228 C4,172 18,120 14,78 C12,52 18,40 28,36 Z" />
      </svg>

      <section class="sx-card" aria-labelledby="sx-title" aria-live="polite">
        <div class="sx-brand">
          <div class="sx-logo-wrap">
            <svg class="sx-progress" viewBox="0 0 72 72" aria-hidden="true">
              <circle class="sx-progress-track" cx="36" cy="36" r="30" />
              <circle class="sx-progress-arc" cx="36" cy="36" r="30" />
            </svg>
            <div class="sx-logo-box">
              <img src="/brand-mark.png" width="36" height="36" alt="" />
            </div>
            <span class="sx-check-burst" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>
          <p class="sx-brand-name">Screen Time Tracker</p>
        </div>

        <p class="sx-badge" id="sx-chip">
          <span class="sx-badge-dot" aria-hidden="true"></span>
          <span id="sx-chip-text">Verifying payment…</span>
        </p>

        <h1 class="sx-title" id="sx-title">Confirming your payment</h1>
        <p class="sx-sub" id="sx-sub">
          Checking with your payment provider. Stay on this page — we’ll unlock Pro when verification succeeds.
        </p>

        <div class="sx-linear" aria-hidden="true">
          <div class="sx-linear-bar"></div>
        </div>

        <div class="sx-rows" aria-label="Order details">
          <div class="sx-row">
            <div class="sx-row-left">
              <span class="sx-row-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 11H7v-2h6V7h2v6z"/></svg>
              </span>
              <span class="sx-row-label">Plan</span>
            </div>
            <span class="sx-row-value" id="fact-plan">Yearly</span>
          </div>
          <div class="sx-row">
            <div class="sx-row-left">
              <span class="sx-row-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5L4 8V6l8 5 8-5v2z"/></svg>
              </span>
              <span class="sx-row-label">Email</span>
            </div>
            <span class="sx-row-value" id="fact-email">—</span>
          </div>
          <div class="sx-row">
            <div class="sx-row-left">
              <span class="sx-row-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4v2h16V4zm0 4H4v2h16V8zm0 4H4v2h16v-2zm0 4H4v2h16v-2z"/></svg>
              </span>
              <span class="sx-row-label">Paid with</span>
            </div>
            <span class="sx-row-value" id="fact-provider">—</span>
          </div>
        </div>

        <p class="sx-order" id="sx-order" hidden>
          Order <strong id="fact-order">—</strong>
        </p>

        <p class="sx-hint" id="hint">This usually takes a few seconds.</p>

        <div class="sx-actions">
          <button type="button" class="sx-btn sx-btn-primary" id="dashBtn" disabled>
            <span id="dashBtnLabel">Waiting for confirmation…</span>
          </button>
          <a class="sx-btn-secondary" id="homeBtn" href="/checkout.html">Back to checkout</a>
        </div>
      </section>
    </div>
  </main>

  <script>
    // Build 1.2.20 — Material You expressive motion + verify-on-success
    const p = new URLSearchParams(location.search);
    const stored = (() => {
      try { return JSON.parse(sessionStorage.getItem("stt_success_ctx") || "{}"); } catch { return {}; }
    })();
    const ppStored = (() => {
      try { return JSON.parse(sessionStorage.getItem("stt_pp_order") || "{}"); } catch { return {}; }
    })();

    let email = (p.get("email") || stored.email || ppStored.email || "").trim().toLowerCase();
    let cycle = p.get("cycle") || stored.cycle || ppStored.cycle || "yearly";
    let provider = (p.get("provider") || p.get("paid") || stored.provider || "").toLowerCase();
    if (provider === "paypal" || p.get("paid") === "paypal") provider = "paypal";
    let userId = p.get("user_id") || stored.user_id || ppStored.user_id || "";
    let paymentId = p.get("payment_id") || stored.payment_id || "";
    let orderId =
      p.get("order_id") ||
      p.get("token") ||
      stored.order_id ||
      ppStored.order_id ||
      "";
    let signature = p.get("signature") || stored.signature || "";
    let accessToken = stored.access_token || ppStored.access_token || "";

    function normalizeExtId(raw) {
      const id = String(raw || "").toLowerCase().replace(/[^a-p]/g, "");
      if (id.length !== 32) return "";
      if (id === "invalid" || id.includes("invalid")) return "";
      return id;
    }

    let extId = normalizeExtId(p.get("ext_id") || stored.ext_id || ppStored.ext_id);
    try {
      if (extId) localStorage.setItem("stt_ext_id", extId);
      else {
        const s = normalizeExtId(localStorage.getItem("stt_ext_id"));
        if (s) extId = s;
        else localStorage.removeItem("stt_ext_id");
      }
    } catch {}

    // Persist success ctx so refresh / retry keeps refs
    try {
      sessionStorage.setItem(
        "stt_success_ctx",
        JSON.stringify({
          email,
          cycle,
          provider,
          user_id: userId,
          payment_id: paymentId,
          order_id: orderId,
          signature,
          access_token: accessToken,
          ext_id: extId,
        }),
      );
    } catch {}

    const planNice = String(cycle).replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
    const payNice = provider
      ? String(provider).replace(/\b\w/g, (c) => c.toUpperCase())
      : "Checkout";

    document.getElementById("fact-plan").textContent = planNice;
    const emailEl = document.getElementById("fact-email");
    if (email) {
      emailEl.innerHTML = "";
      const a = document.createElement("a");
      a.href = "mailto:" + email;
      a.textContent = email;
      emailEl.appendChild(a);
    } else {
      emailEl.textContent = "Your billing email";
    }
    document.getElementById("fact-provider").textContent = payNice;

    const orderWrap = document.getElementById("sx-order");
    const orderRef = paymentId || orderId;
    if (orderRef) {
      orderWrap.hidden = false;
      document.getElementById("fact-order").textContent = orderRef;
    }

    const chipText = document.getElementById("sx-chip-text");
    const title = document.getElementById("sx-title");
    const sub = document.getElementById("sx-sub");
    const hint = document.getElementById("hint");
    const dashBtn = document.getElementById("dashBtn");
    const dashBtnLabel = document.getElementById("dashBtnLabel");
    const homeBtn = document.getElementById("homeBtn");

    function setState(state, copy) {
      document.body.dataset.sxState = state;
      document.body.classList.remove("sx-state-flash");
      void document.body.offsetWidth;
      document.body.classList.add("sx-state-flash");
      if (copy.chip) chipText.textContent = copy.chip;
      if (copy.title) title.textContent = copy.title;
      if (copy.sub) sub.textContent = copy.sub;
      if (copy.hint != null) hint.textContent = copy.hint;
      if (copy.btn) dashBtnLabel.textContent = copy.btn;
      document.title =
        state === "confirmed"
          ? "You're Pro — Screen Time Tracker"
          : state === "failed"
            ? "Payment not confirmed — Screen Time Tracker"
            : "Confirming payment — Screen Time Tracker";
    }

    // Soft Material state-layer ripple origin on primary button
    dashBtn.addEventListener("pointerdown", (e) => {
      const r = dashBtn.getBoundingClientRect();
      dashBtn.style.setProperty("--sx-rx", ((e.clientX - r.left) / r.width) * 100 + "%");
      dashBtn.style.setProperty("--sx-ry", ((e.clientY - r.top) / r.height) * 100 + "%");
    });

    function authHeaders() {
      const h = { "Content-Type": "application/json", Accept: "application/json" };
      if (accessToken) h.Authorization = "Bearer " + accessToken;
      return h;
    }

    function pingExtension(payload) {
      return new Promise((resolve) => {
        if (!extId || typeof chrome === "undefined" || !chrome.runtime?.sendMessage) {
          resolve({ ok: false, error: "no_runtime" });
          return;
        }
        try {
          chrome.runtime.sendMessage(extId, payload, function (res) {
            const err = chrome.runtime.lastError;
            if (err) {
              resolve({ ok: false, error: err.message || "lastError" });
              return;
            }
            resolve(res || { ok: false });
          });
        } catch (e) {
          resolve({ ok: false, error: e.message || "send_failed" });
        }
      });
    }

    async function openDashboard() {
      dashBtn.disabled = false;
      const res = await pingExtension({
        type: "STT_OPEN_DASHBOARD",
        hash: "pro",
        refresh: true,
        open: true,
        replaceTab: true,
        email,
        cycle,
        provider,
        user_id: userId,
        is_pro: true,
      });
      if (res?.ok) {
        hint.textContent = "Opening your dashboard…";
        try {
          const u = new URL(location.href);
          u.searchParams.set("verified", "1");
          u.searchParams.set("handoff", "1");
          u.searchParams.delete("pending");
          history.replaceState(null, "", u.toString());
        } catch {}
        return true;
      }
      hint.textContent =
        "Pro is unlocked. Open Screen Time Tracker from Chrome’s toolbar → Dashboard.";
      dashBtnLabel.textContent = "Open dashboard";
      return false;
    }

    async function checkAccess() {
      if (!email) return null;
      const url = "/api/stt/access?product=stt&email=" + encodeURIComponent(email);
      const res = await fetch(url, { headers: authHeaders() });
      const data = await res.json().catch(() => ({}));
      if (data && data.is_pro === true) return data;
      return null;
    }

    async function verifyRazorpay() {
      if (!paymentId) return null;
      if (signature && orderId) {
        const res = await fetch("/api/razorpay/verify-payment", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({
            razorpay_payment_id: paymentId,
            razorpay_order_id: orderId,
            razorpay_signature: signature,
            email,
            cycle,
            user_id: userId || undefined,
            access_token: accessToken || undefined,
            ext_id: extId || undefined,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success && data.is_pro === true) return data;
      }
      const claim = await fetch("/api/razorpay/claim-payment", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({
          payment_id: paymentId,
          order_id: orderId || undefined,
          email,
          cycle,
          user_id: userId || undefined,
          access_token: accessToken || undefined,
          ext_id: extId || undefined,
        }),
      });
      const c = await claim.json().catch(() => ({}));
      if (claim.ok && c.success && c.is_pro === true) return c;
      return null;
    }

    async function verifyPaypal() {
      if (!orderId) return null;
      const res = await fetch("/api/paypal/capture-order", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({
          order_id: orderId,
          email,
          cycle,
          user_id: userId || undefined,
          access_token: accessToken || undefined,
          ext_id: extId || undefined,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.success && data.is_pro === true) return data;
      return null;
    }

    async function runVerification() {
      setState("verifying", {
        chip: "Verifying payment…",
        title: "Confirming your payment",
        sub:
          "Checking with " +
          (payNice || "your payment provider") +
          ". Stay on this page — dashboard opens only after Pro is unlocked.",
        hint: "This usually takes a few seconds.",
        btn: "Waiting for confirmation…",
      });
      dashBtn.disabled = true;

      let confirmed = null;
      const maxAttempts = 8;

      for (let i = 0; i < maxAttempts; i++) {
        hint.textContent =
          i === 0
            ? "Contacting " + (payNice || "provider") + "…"
            : "Still confirming… (" + (i + 1) + "/" + maxAttempts + ")";

        try {
          if (provider === "razorpay" || paymentId) {
            confirmed = await verifyRazorpay();
          } else if (provider === "paypal" || orderId) {
            confirmed = await verifyPaypal();
          }
          if (!confirmed) confirmed = await checkAccess();
        } catch (e) {
          hint.textContent = (e && e.message) || "Network blip — retrying…";
        }

        if (confirmed && confirmed.is_pro === true) break;
        await new Promise((r) => setTimeout(r, 1500 + i * 400));
      }

      if (confirmed && confirmed.is_pro === true) {
        if (confirmed.email) email = confirmed.email;
        if (confirmed.cycle || confirmed.plan) cycle = confirmed.cycle || confirmed.plan;
        if (confirmed.provider) provider = confirmed.provider;
        if (confirmed.user_id) userId = confirmed.user_id;
        document.getElementById("fact-plan").textContent = String(cycle)
          .replace(/_/g, " ")
          .replace(/\b\w/g, (c) => c.toUpperCase());
        document.getElementById("fact-provider").textContent = String(provider || payNice)
          .replace(/\b\w/g, (c) => c.toUpperCase());

        setState("confirmed", {
          chip: "Payment confirmed",
          title: "Welcome to Pro",
          sub: "Pro is unlocked on this email. Opening your dashboard…",
          hint: "Almost done — handoff to the extension.",
          btn: "Opening dashboard…",
        });
        try {
          sessionStorage.removeItem("stt_pp_order");
          sessionStorage.removeItem("stt_rzp_order");
        } catch {}
        await openDashboard();
        return;
      }

      setState("failed", {
        chip: "Not confirmed yet",
        title: "We couldn’t confirm Pro yet",
        sub:
          "Payment may still be processing, or verification failed. You remain on Free until Pro unlocks. Stay here and retry, or return to checkout with your payment ID.",
        hint: orderRef
          ? "If you only logged into PayPal without tapping Pay Now, no charge was made — start checkout again."
          : "No payment reference found — complete checkout again.",
        btn: "Retry verification",
      });
      dashBtn.disabled = false;
      homeBtn.href = "/checkout.html" + (email ? "?email=" + encodeURIComponent(email) : "");
    }

    dashBtn.addEventListener("click", function () {
      if (document.body.dataset.sxState === "failed") {
        runVerification();
        return;
      }
      if (document.body.dataset.sxState === "confirmed") {
        openDashboard();
      }
    });

    if (p.get("verified") === "1" || p.get("handoff") === "1") {
      setState("confirmed", {
        chip: "Payment confirmed",
        title: "Welcome to Pro",
        sub: "Pro is ready. Opening your dashboard…",
        hint: "",
        btn: "Open dashboard",
      });
      openDashboard();
    } else {
      runVerification();
    }
  </script>
</body>
</html>
