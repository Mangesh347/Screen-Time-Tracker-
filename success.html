<!DOCTYPE html>
<html lang="en" data-visual="material" data-mode="light" data-theme="auto" data-m3="expressive">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're Pro — Screen Time Tracker</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
  <script>
    (function () {
      try {
        var v = localStorage.getItem("stt_site_visual") || "material";
        if (v !== "editorial" && v !== "minimal") v = "material";
        var m = localStorage.getItem("stt_site_mode") || "system";
        var tone = m === "dark" || m === "light" ? m :
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-visual", v);
        document.documentElement.setAttribute("data-mode", tone);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="success-box">
    <img src="/brand-mark.png" width="48" height="48" alt="" style="border-radius:12px;margin:0 auto 16px;display:block" />
    <p class="eyebrow">Payment received</p>
    <h1>Welcome to Pro</h1>
    <p class="lede" id="detail">Opening Screen Time Tracker…</p>
    <p class="lede" id="hint" style="font-size:14px;opacity:.8;margin-top:8px">If the extension doesn’t open, click the button below.</p>
    <a class="btn" id="openExt" href="/">Open dashboard</a>
  </div>
  <script src="/site-theme.js" defer></script>
  <script>
    const p = new URLSearchParams(location.search);
    const email = (p.get('email') || '').trim().toLowerCase();
    const cycle = p.get('cycle') || 'yearly';
    const provider = p.get('provider') || '';
    const userId = p.get('user_id') || '';
    let extId = (p.get('ext_id') || '').replace(/[^a-z0-9]/gi, '');

    // Persist last known extension id so marketing-link checkouts can still deep-link
    try {
      if (extId) localStorage.setItem('stt_ext_id', extId);
      else extId = (localStorage.getItem('stt_ext_id') || '').replace(/[^a-z0-9]/gi, '');
    } catch {}

    const dashUrl = extId
      ? ('chrome-extension://' + extId + '/pages/dashboard.html#pro')
      : '';

    document.getElementById('detail').textContent =
      `Pro is active on ${email || 'your billing email'} (${cycle}${provider ? ' via ' + provider : ''}).` +
      (dashUrl ? ' Redirecting to your extension dashboard…' : ' Open Screen Time Tracker in Chrome — sign in with this email to see Pro.');

    const btn = document.getElementById('openExt');

    function openDashboard() {
      if (!dashUrl) return false;
      try {
        // Prefer replacing this tab so the handoff feels instant
        location.replace(dashUrl);
        return true;
      } catch (e) {
        try {
          window.open(dashUrl, '_blank', 'noopener');
          return true;
        } catch (e2) {
          return false;
        }
      }
    }

    if (dashUrl) {
      btn.href = dashUrl;
      btn.textContent = 'Open Pro dashboard';
      btn.addEventListener('click', function (ev) {
        ev.preventDefault();
        openDashboard();
      });
      // Fast redirect after paint
      setTimeout(openDashboard, 250);
      // Retry once in case Chrome blocks the first navigation
      setTimeout(function () {
        if (document.visibilityState === 'visible') openDashboard();
      }, 1200);
    } else {
      btn.href = '/';
      btn.textContent = 'Back home — thank you';
      document.getElementById('hint').textContent =
        'Tip: start checkout from the extension Upgrade button so we can open your dashboard automatically next time.';
    }

    try {
      localStorage.setItem('stt_checkout_success', JSON.stringify({
        email, cycle, provider, ext_id: extId, user_id: userId, at: Date.now(),
      }));
    } catch {}

    // Notify opener (extension tab) if present
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({
          type: 'STT_CHECKOUT_SUCCESS',
          email, cycle, provider, user_id: userId, is_pro: true,
        }, '*');
      }
    } catch {}
  </script>
</body>
</html>
